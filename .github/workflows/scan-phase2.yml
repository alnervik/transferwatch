name: Scan Phase 2 Only

on:
  workflow_dispatch:

jobs:
  # Fas 2: 15 batchar × 95 = 1425 par (matchar MAX_BOARD_FETCHES i scanner.js).
  # max-parallel: 5 håller max 5 runners mot tibiamarket-API:t samtidigt.
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        skip: [0, 95, 190, 285, 380, 475, 570, 665, 760, 855, 950, 1045, 1140, 1235, 1330]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
        working-directory: scanner
      - run: node scanner.js --phase2 --skip=${{ matrix.skip }} --take=95
        working-directory: scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
