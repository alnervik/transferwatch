name: Scan Tibia Markets

on:
  schedule:
    - cron: '54 1 * * *'  # Kl 03:54 svensk tid (UTC+2)
  workflow_dispatch:

jobs:
  # Fas 1: 2 batchar × 95 världar (~140 transferbara totalt). Varje skannad värld
  # ≈ 1 API-request och API:t stryper runt ~100 req/körning, så vi batchar i 95
  # precis som fas 2. max-parallel: 2 håller nere samtidig last mot tibiamarket.
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        skip: [0, 95]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
        working-directory: scanner
      - run: node scanner.js --phase1 --skip=${{ matrix.skip }} --take=95
        working-directory: scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  # Fas 2: 15 batchar × 95 = 1425 par (matchar MAX_BOARD_FETCHES i scanner.js).
  # max-parallel: 5 håller max 5 runners mot tibiamarket-API:t samtidigt — samma
  # strypning som det tidigare 2-vågs-upplägget, bara skalat till 3 vågor.
  phase2:
    needs: phase1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        skip: [0, 95, 190, 285, 380, 475, 570, 665, 760, 855, 950, 1045, 1140, 1235, 1330]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
        working-directory: scanner
      - run: node scanner.js --phase2 --skip=${{ matrix.skip }} --take=95
        working-directory: scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
